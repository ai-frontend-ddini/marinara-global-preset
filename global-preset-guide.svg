<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a6e"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="800" rx="20" fill="#f6f8fc"/>

  <!-- 제목 + 리본 -->
  <text x="30" y="62" font-size="30" font-weight="800" fill="#1e3a6e">Global Preset</text>
  <text x="30" y="92" font-size="15" fill="#5b6478">프리셋을 업데이트해도, 방마다 다시 고를 필요 없어요</text>
  <polygon points="872,40 960,40 960,68 872,68 882,54" fill="#1e3a6e"/>
  <text x="921" y="58" font-size="12" font-weight="600" fill="#e8eefc" text-anchor="middle" letter-spacing="0.5">Preset</text>

  <!-- ① 자동 교체 -->
  <rect x="30" y="120" width="440" height="290" rx="14" fill="#ffffff" stroke="#e1e6ef"/>
  <text x="54" y="156" font-size="18" font-weight="700" fill="#1e2433">① 새 버전으로 자동 교체</text>

  <rect x="54" y="178" width="38" height="20" rx="5" fill="#fde8e8"/>
  <text x="73" y="192" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">삭제</text>
  <rect x="54" y="204" width="170" height="44" rx="8" fill="#eef0f4" stroke="#c9ced8"/>
  <text x="139" y="231" font-size="14" fill="#8a91a0" text-anchor="middle">MyPreset v1.2</text>
  <line x1="92" y1="226" x2="186" y2="226" stroke="#8a91a0" stroke-width="1.5"/>

  <line x1="230" y1="226" x2="264" y2="226" stroke="#1e3a6e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="270" y="178" width="38" height="20" rx="5" fill="#e3ebfa"/>
  <text x="289" y="192" font-size="12" font-weight="600" fill="#1e3a6e" text-anchor="middle">최신</text>
  <rect x="270" y="204" width="176" height="44" rx="8" fill="#1e3a6e"/>
  <text x="358" y="231" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">MyPreset v1.5</text>

  <text x="54" y="280" font-size="13" fill="#5b6478">쓰던 방들은 자동으로 이동</text>
  <rect x="270" y="262" width="52" height="26" rx="13" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="296" y="280" font-size="12" fill="#1e3a6e" text-anchor="middle">방 A</text>
  <rect x="332" y="262" width="52" height="26" rx="13" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="358" y="280" font-size="12" fill="#1e3a6e" text-anchor="middle">방 B</text>
  <rect x="394" y="262" width="52" height="26" rx="13" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="420" y="280" font-size="12" fill="#1e3a6e" text-anchor="middle">방 C</text>

  <rect x="54" y="306" width="176" height="36" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-dasharray="5 4"/>
  <text x="142" y="329" font-size="13" fill="#5b6478" text-anchor="middle">OtherPreset v1.5</text>
  <text x="244" y="329" font-size="13" fill="#8a91a0">이름이 다른 계열은 그대로</text>

  <text x="54" y="374" font-size="14" fill="#3a4256">구버전을 지우기만 하면, 같은 이름의 가장 높은</text>
  <text x="54" y="395" font-size="14" fill="#3a4256">버전으로 방들이 알아서 넘어가요.</text>

  <!-- ② 글로벌 프리셋 -->
  <rect x="490" y="120" width="440" height="290" rx="14" fill="#ffffff" stroke="#e1e6ef"/>
  <text x="514" y="156" font-size="18" font-weight="700" fill="#1e2433">② 글로벌 프리셋</text>

  <rect x="630" y="176" width="160" height="44" rx="8" fill="#1e3a6e"/>
  <text x="710" y="203" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">글로벌 프리셋</text>
  <polyline points="710,220 710,238 576,238 576,256" fill="none" stroke="#1e3a6e" stroke-width="2" marker-end="url(#ah)"/>
  <polyline points="710,238 844,238 844,256" fill="none" stroke="#1e3a6e" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="710" y1="238" x2="710" y2="256" stroke="#1e3a6e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="514" y="260" width="124" height="48" rx="8" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="576" y="281" font-size="13" font-weight="600" fill="#1e2433" text-anchor="middle">프리셋 없는 방</text>
  <text x="576" y="299" font-size="11" fill="#5b6478" text-anchor="middle">자동 적용</text>
  <rect x="648" y="260" width="124" height="48" rx="8" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="710" y="281" font-size="13" font-weight="600" fill="#1e2433" text-anchor="middle">프리셋 삭제된 방</text>
  <text x="710" y="299" font-size="11" fill="#5b6478" text-anchor="middle">새 버전 없으면 적용</text>
  <rect x="782" y="260" width="124" height="48" rx="8" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="844" y="281" font-size="13" font-weight="600" fill="#1e2433" text-anchor="middle">새로 만든 방</text>
  <text x="844" y="299" font-size="11" fill="#5b6478" text-anchor="middle">물어보고 적용</text>

  <rect x="514" y="322" width="124" height="30" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-dasharray="5 4"/>
  <text x="576" y="342" font-size="13" fill="#5b6478" text-anchor="middle">직접 고른 방</text>
  <text x="650" y="342" font-size="13" fill="#8a91a0">글로벌을 바꿔도 건드리지 않아요</text>

  <text x="514" y="374" font-size="14" fill="#3a4256">글로벌을 바꾸면 글로벌을 쓰던 방만</text>
  <text x="514" y="395" font-size="14" fill="#3a4256">같이 바뀌어요.</text>

  <!-- ③ Preset 패널 -->
  <rect x="30" y="430" width="440" height="250" rx="14" fill="#ffffff" stroke="#e1e6ef"/>
  <text x="54" y="466" font-size="18" font-weight="700" fill="#1e2433">③ Preset 패널</text>

  <rect x="54" y="484" width="392" height="140" rx="8" fill="#ffffff" stroke="#d5dae4"/>
  <rect x="68" y="500" width="110" height="12" rx="6" fill="#eef0f4"/>
  <rect x="68" y="520" width="90" height="12" rx="6" fill="#eef0f4"/>
  <rect x="68" y="548" width="116" height="12" rx="6" fill="#eef0f4"/>
  <rect x="68" y="568" width="74" height="12" rx="6" fill="#eef0f4"/>
  <rect x="68" y="596" width="100" height="12" rx="6" fill="#eef0f4"/>

  <rect x="196" y="494" width="188" height="120" rx="6" fill="#f6f8fc" stroke="#d5dae4"/>
  <text x="212" y="514" font-size="11" fill="#8a91a0">글로벌</text>
  <text x="258" y="514" font-size="11" font-weight="700" fill="#1e3a6e">프리셋별</text>
  <text x="314" y="514" font-size="11" fill="#8a91a0">내역</text>
  <line x1="256" y1="520" x2="306" y2="520" stroke="#1e3a6e" stroke-width="2"/>
  <line x1="204" y1="522" x2="376" y2="522" stroke="#e1e6ef"/>
  <rect x="210" y="534" width="12" height="12" rx="2" fill="#1e3a6e"/>
  <path d="M212.5,540 L215.5,543 L220,537" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="230" y="545" font-size="11" fill="#1e2433">방 A</text>
  <text x="372" y="545" font-size="10" fill="#5b6478" text-anchor="end">MyPreset v1.5</text>
  <rect x="210" y="560" width="12" height="12" rx="2" fill="#1e3a6e"/>
  <path d="M212.5,566 L215.5,569 L220,563" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="230" y="571" font-size="11" fill="#1e2433">방 B</text>
  <text x="372" y="571" font-size="10" fill="#5b6478" text-anchor="end">MyPreset v1.5</text>
  <rect x="210" y="586" width="12" height="12" rx="2" fill="#ffffff" stroke="#b9c0cd"/>
  <text x="230" y="597" font-size="11" fill="#1e2433">방 C</text>
  <text x="372" y="597" font-size="10" fill="#5b6478" text-anchor="end">OtherPreset v1.5</text>

  <polygon points="392,500 446,500 446,520 392,520 399,510" fill="#1e3a6e"/>
  <text x="423" y="514" font-size="9" font-weight="600" fill="#e8eefc" text-anchor="middle">Preset</text>

  <text x="54" y="650" font-size="14" fill="#3a4256">오른쪽 리본을 누르면 모든 방의 프리셋을 한눈에.</text>
  <text x="54" y="671" font-size="14" fill="#3a4256">체크해서 여러 방을 한 번에 바꿀 수 있어요.</text>

  <!-- ④ 방별 토글 -->
  <rect x="490" y="430" width="440" height="250" rx="14" fill="#ffffff" stroke="#e1e6ef"/>
  <text x="514" y="466" font-size="18" font-weight="700" fill="#1e2433">④ 방별 토글</text>
  <rect x="626" y="451" width="92" height="22" rx="11" fill="#eef0f4"/>
  <text x="672" y="466" font-size="11" fill="#5b6478" text-anchor="middle">선택 · 기본 꺼짐</text>

  <rect x="514" y="486" width="196" height="128" rx="8" fill="#f6f8fc" stroke="#d5dae4"/>
  <text x="530" y="510" font-size="13" font-weight="700" fill="#1e2433">방 A</text>
  <text x="696" y="510" font-size="11" fill="#8a91a0" text-anchor="end">MyPreset</text>
  <text x="530" y="540" font-size="13" fill="#3a4256">문체</text>
  <rect x="664" y="528" width="30" height="16" rx="8" fill="#1e3a6e"/><circle cx="686" cy="536" r="6" fill="#fff"/>
  <text x="530" y="568" font-size="13" fill="#3a4256">묘사</text>
  <rect x="664" y="556" width="30" height="16" rx="8" fill="#1e3a6e"/><circle cx="686" cy="564" r="6" fill="#fff"/>
  <text x="530" y="596" font-size="13" fill="#3a4256">분위기</text>
  <rect x="664" y="584" width="30" height="16" rx="8" fill="#1e3a6e"/><circle cx="686" cy="592" r="6" fill="#fff"/>

  <rect x="726" y="486" width="196" height="128" rx="8" fill="#f6f8fc" stroke="#d5dae4"/>
  <text x="742" y="510" font-size="13" font-weight="700" fill="#1e2433">방 B</text>
  <text x="908" y="510" font-size="11" fill="#8a91a0" text-anchor="end">MyPreset</text>
  <text x="742" y="540" font-size="13" fill="#3a4256">문체</text>
  <rect x="876" y="528" width="30" height="16" rx="8" fill="#1e3a6e"/><circle cx="898" cy="536" r="6" fill="#fff"/>
  <text x="742" y="568" font-size="13" fill="#3a4256">묘사</text>
  <rect x="876" y="556" width="30" height="16" rx="8" fill="#d5dae4"/><circle cx="884" cy="564" r="6" fill="#fff"/>
  <text x="742" y="596" font-size="13" fill="#3a4256">분위기</text>
  <rect x="876" y="584" width="30" height="16" rx="8" fill="#1e3a6e"/><circle cx="898" cy="592" r="6" fill="#fff"/>

  <text x="514" y="650" font-size="14" fill="#3a4256">같은 프리셋이라도 방마다 켜고 끈 섹션을 기억해요.</text>
  <text x="514" y="671" font-size="14" fill="#3a4256">방에 들어가면 그 방 상태로 맞춰져요.</text>

  <!-- ⑤ 분기 -->
  <rect x="30" y="700" width="900" height="76" rx="14" fill="#ffffff" stroke="#e1e6ef"/>
  <text x="54" y="733" font-size="17" font-weight="700" fill="#1e2433">⑤ 분기한 방은 원래 방 설정을 그대로 이어받아요</text>
  <text x="54" y="757" font-size="13" fill="#5b6478">글로벌 따르기, 방별 토글이 끊기지 않아요</text>
  <rect x="660" y="720" width="96" height="36" rx="8" fill="#1e3a6e"/>
  <text x="708" y="743" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">본방</text>
  <line x1="762" y1="738" x2="800" y2="738" stroke="#1e3a6e" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="806" y="720" width="96" height="36" rx="8" fill="#eef3fc" stroke="#c5d3ee"/>
  <text x="854" y="743" font-size="13" font-weight="600" fill="#1e3a6e" text-anchor="middle">분기</text>
</svg>
